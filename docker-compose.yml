version: '3.8'

# Nemaxks — production-like стек.
#
# Запуск:
#   cp .env.example .env  # заполнить POSTGRES_PASSWORD, REDIS_PASSWORD, JWT_SECRET
#   docker compose up -d                 # postgres + redis + livekit + backend + frontend(prod)
#   docker compose --profile dev up -d   # + frontend-dev (vite dev server с hot reload)
#
# Пароли не имеют дефолтов (:?required) — задайте их в .env.

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nemaxks-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nemaxks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-nemaxks}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nemaxks}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (пароль обязателен)
  redis:
    image: redis:7-alpine
    container_name: nemaxks-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?required}"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LiveKit Voice/Video server (конфиг — ./livekit.yaml в корне репо)
  livekit:
    image: livekit/livekit-server:latest
    container_name: nemaxks-livekit
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"     # HTTP/WebSocket API
      - "7881:7881"     # RTC TCP
      - "7882:7882/udp" # RTC UDP
      - "50000-50100:50000-50100/udp" # RTC port range (см. livekit.yaml)

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nemaxks-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nemaxks}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-nemaxks}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:?required}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # Публичный адрес backend (webhook URL для MAX-ботов) и база MAX Bot API
      PUBLIC_URL: ${PUBLIC_URL:-}
      MAX_API_BASE: ${MAX_API_BASE:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      # LiveKit (проброс ключей; по умолчанию — devkey/devsecret из livekit.yaml)
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-}
      PORT: 8000
      GIN_MODE: ${GIN_MODE:-release}
      PAYMENTS_TEST_MODE: ${PAYMENTS_TEST_MODE:-false}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      BILLING_WEBHOOK_TOKEN: ${BILLING_WEBHOOK_TOKEN:-}
      JARVIS_DAILY_FREE: ${JARVIS_DAILY_FREE:-3}
      JARVIS_DAILY_PREMIUM: ${JARVIS_DAILY_PREMIUM:-100}
      ALLOW_TEST_LICENSE_KEY: ${ALLOW_TEST_LICENSE_KEY:-false}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (PRODUCTION): собранный статический бандл за nginx.
  # Запускается по умолчанию вместе со стеком.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nemaxks-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:5173"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Caddy — TLS-терминация (авто-HTTPS через sslip.io-домены, см. Caddyfile)
  caddy:
    image: caddy:2-alpine
    container_name: nemaxks-caddy
    restart: unless-stopped
    depends_on:
      - frontend
      - livekit
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Frontend (DEVELOPMENT): vite dev server с hot reload.
  # Не собирает образ — монтирует исходники. Запуск: --profile dev
  frontend-dev:
    image: node:20-alpine
    container_name: nemaxks-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5174:5173"
    profiles:
      - dev

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  default:
    name: nemaxks-network
