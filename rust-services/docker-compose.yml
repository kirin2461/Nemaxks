version: '3.8'

# Rust-микросервисы Nemaxks: audit-service и search-service (gRPC).
# ВНИМАНИЕ: build context = корень репозитория (нужен каталог proto/):
#   docker compose -f rust-services/docker-compose.yml build
# (compose автоматически резолвит context: ".." относительно этого файла)
#
# Статус gRPC-транспорта: EXPERIMENTAL — Go-бэкенд пока не вызывает эти
# сервисы в production-пути (см. README.md, раздел про gRPC).

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: comm_postgres
    environment:
      POSTGRES_USER: comm_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: communication_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comm_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - comm_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: comm_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?required}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - comm_network

  # Audit Service (gRPC, порт 50051)
  audit-service:
    build:
      context: ..
      dockerfile: rust-services/audit-service/Dockerfile
    container_name: audit_service
    environment:
      DATABASE_URL: postgresql://comm_user:${POSTGRES_PASSWORD:?required}@postgres:5432/communication_db
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - comm_network

  # Search Service (gRPC, порт 50052)
  search-service:
    build:
      context: ..
      dockerfile: rust-services/search-service/Dockerfile
    container_name: search_service
    environment:
      DATABASE_URL: postgresql://comm_user:${POSTGRES_PASSWORD:?required}@postgres:5432/communication_db
      TANTIVY_INDEX_PATH: /data/search_index
    ports:
      - "50052:50052"
    volumes:
      - search_index:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - comm_network

volumes:
  postgres_data:
  redis_data:
  search_index:

networks:
  comm_network:
    driver: bridge
