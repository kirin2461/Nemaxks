[package]
name = "search-service"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.10"
tonic-health = "0.10"
prost = "0.12"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "signal"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono"] }
tantivy = "0.21" # Full-text search engine
zstd = "0.12" # bundled-сборка (feature pkg-config несовместим с системной libzstd)
dotenv = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
tonic-build = "0.10"
